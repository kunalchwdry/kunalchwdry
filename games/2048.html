<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tech 2048 — Kunal's Arcade</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#233349;--cyan:#39d2ff;--blue:#58a6ff;--purple:#a371f7;--green:#3fb950;--gold:#ffd166;--text:#e6edf3;--muted:#8b949e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2740 0%,transparent 60%),radial-gradient(900px 500px at 90% 0%,#2a1a4a 0%,transparent 55%),var(--bg);color:var(--text);font-family:ui-monospace,JetBrains Mono,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center}
header{width:min(920px,94vw);margin:18px auto 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px;background:#0f1724}
.wrap{width:min(920px,94vw);display:grid;grid-template-columns:1fr 280px;gap:14px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#121a28,#0f1724);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.board{padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#0a1220;padding:10px;border-radius:12px;border:1px solid #1e2e46}
.cell{aspect-ratio:1;background:#121a28;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;border:1px solid var(--line);transition:.12s}
.cell[data-v="0"]{background:#0d1524;color:transparent}
.cell[data-v="2"]{background:#1a2a44;color:var(--cyan)}
.cell[data-v="4"]{background:#1a2740;color:var(--blue)}
.cell[data-v="8"]{background:#1e2a4a;color:var(--purple)}
.cell[data-v="16"]{background:#2a1f44;color:var(--purple)}
.cell[data-v="32"]{background:#2a2a4a;color:var(--gold)}
.cell[data-v="64"]{background:#3a2a2a;color:var(--gold)}
.cell[data-v="128"]{background:#3a3a1a;color:var(--gold);font-size:20px}
.cell[data-v="256"]{background:#2a3a1a;color:var(--green);font-size:20px}
.cell[data-v="512"]{background:#1a3a2a;color:var(--green);font-size:20px}
.cell[data-v="1024"]{background:#1a3a3a;color:var(--cyan);font-size:18px}
.cell[data-v="2048"]{background:linear-gradient(135deg,#ffd166,#f78166);color:#0d1117;font-size:18px;box-shadow:0 0 20px rgba(255,209,102,.5)}
.side{padding:14px;display:flex;flex-direction:column;gap:10px}
.stat{display:flex;justify-content:space-between;padding:9px 10px;border-radius:10px;background:#0d1524;border:1px solid var(--line);font-size:13px}
.stat b{font-size:18px}
.btn{appearance:none;border:1px solid var(--line);background:#0f1a2b;color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px}
.btn.primary{background:linear-gradient(180deg,#1b2a44,#122038);border-color:#2a4a7a}
.hint{color:var(--muted);font-size:11px;line-height:1.5}
</style>
</head>
<body>
<header>
<div class="brand">KUNAL / ARCADE — <span style="color:var(--gold)">TECH 2048</span></div>
<a class="badge" href="./index.html">← All Games</a>
</header>
<div class="wrap">
<div class="card board">
<div class="grid" id="grid"></div>
</div>
<div class="card side">
<div class="stat"><span>Score</span><b id="score">0</b></div>
<div class="stat"><span>Best</span><b id="best">0</b></div>
<div class="stat"><span>Moves</span><b id="moves">0</b></div>
<button class="btn primary" id="newBtn">↻ New Game</button>
<button class="btn" id="undoBtn">↩ Undo</button>
<div class="hint">
<strong>How:</strong> Arrows/WASD to slide. Same tech stacks merge: 2=PY,4=TS,8=PG,16=RE,32=FA,64=SB,128=DO,256=LX,512=K8,1024=AI,2048=GOAL!<br><br>
Reach 2048. Undo saves 1 move. Best saved locally.
</div>
</div>
</div>
<script>
let board=[],score=0,best=0,moves=0,history=[];
const gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),movesEl=document.getElementById('moves');
best=parseInt(localStorage.getItem('tech2048-best')||'0');bestEl.textContent=best;

function init(){
 board=Array(4).fill(0).map(()=>Array(4).fill(0));
 score=0;moves=0;history=[];
 addTile();addTile();
 render();
}
function addTile(){
 let empties=[];
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]===0)empties.push([r,c]);
 if(empties.length===0)return;
 let [r,c]=empties[Math.floor(Math.random()*empties.length)];
 board[r][c]=Math.random()<0.9?2:4;
}
function render(){
 gridEl.innerHTML='';
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  const d=document.createElement('div');d.className='cell';d.dataset.v=board[r][c];d.textContent=board[r][c]||'';
  gridEl.appendChild(d);
 }
 scoreEl.textContent=score;movesEl.textContent=moves;
 if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('tech2048-best',best);}
 if(isGameOver()){setTimeout(()=>{alert(`Game Over! Score ${score}`)},100);}
}
function slide(row){
 let arr=row.filter(v=>v!==0);
 let missing=4-arr.length;
 let newRow=[];let i=0;let gained=0;
 while(i<arr.length){
  if(i+1<arr.length&&arr[i]===arr[i+1]){newRow.push(arr[i]*2);gained+=arr[i]*2;i+=2;}else{newRow.push(arr[i]);i++;}
 }
 while(newRow.length<4)newRow.push(0);
 return {row:newRow,gain:gained,moved:newRow.toString()!==row.toString()};
}
function rotate(b){let nb=Array(4).fill(0).map(()=>Array(4).fill(0));for(let r=0;r<4;r++)for(let c=0;c<4;c++)nb[c][3-r]=b[r][c];return nb;}
function move(dir){
 let old=board.map(r=>[...r]);
 let oldScore=score;
 let moved=false;let gain=0;
 if(dir==='left'){
  for(let r=0;r<4;r++){let res=slide(board[r]);board[r]=res.row;gain+=res.gain;moved=moved||res.moved;}
 }else if(dir==='right'){
  for(let r=0;r<4;r++){let rev=[...board[r]].reverse();let res=slide(rev);board[r]=res.row.reverse();gain+=res.gain;moved=moved||res.moved;}
 }else if(dir==='up'){
  board=rotate(rotate(rotate(board)));
  for(let r=0;r<4;r++){let res=slide(board[r]);board[r]=res.row;gain+=res.gain;moved=moved||res.moved;}
  board=rotate(board);
 }else if(dir==='down'){
  board=rotate(board);
  for(let r=0;r<4;r++){let res=slide(board[r]);board[r]=res.row;gain+=res.gain;moved=moved||res.moved;}
  board=rotate(rotate(rotate(board)));
 }
 if(moved){
  history.push({board:old,score:oldScore});if(history.length>5)history.shift();
  score+=gain;moves++;addTile();render();
 }
}
function isGameOver(){
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(board[r][c]===0)return false;
 for(let r=0;r<4;r++)for(let c=0;c<4;c++){
  if(r<3&&board[r][c]===board[r+1][c])return false;
  if(c<3&&board[r][c]===board[r][c+1])return false;
 }
 return true;
}
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','a'].includes(e.key.toLowerCase())){e.preventDefault();move('left');}
 if(['ArrowRight','d'].includes(e.key.toLowerCase())){e.preventDefault();move('right');}
 if(['ArrowUp','w'].includes(e.key.toLowerCase())){e.preventDefault();move('up');}
 if(['ArrowDown','s'].includes(e.key.toLowerCase())){e.preventDefault();move('down');}
});
document.getElementById('newBtn').onclick=init;
document.getElementById('undoBtn').onclick=()=>{
 if(history.length===0)return;
 let last=history.pop();
 board=last.board;score=last.score;moves=Math.max(0,moves-1);render();
};
let touchStart=null;
gridEl.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};});
gridEl.addEventListener('touchend',e=>{
 if(!touchStart)return;
 let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
 if(Math.abs(dx)>Math.abs(dy)){if(dx>20)move('right');else if(dx<-20)move('left');}
 else{if(dy>20)move('down');else if(dy<-20)move('up');}
 touchStart=null;
});
init();
</script>
</body>
</html>
