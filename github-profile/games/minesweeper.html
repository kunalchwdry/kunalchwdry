<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Code Mines — Kunal's Arcade</title>
<style>
:root{--bg:#0d1117;--line:#233349;--cyan:#39d2ff;--blue:#58a6ff;--purple:#a371f7;--green:#3fb950;--gold:#ffd166;--red:#f85149;--text:#e6edf3;--muted:#8b949e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1a2740 0%,transparent 60%),radial-gradient(900px 500px at 90% 0%,#2a1a4a 0%,transparent 55%),var(--bg);color:var(--text);font-family:ui-monospace,JetBrains Mono,monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:min(920px,94vw);margin:18px auto 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:999px;background:#0f1724}
.wrap{width:min(920px,94vw);display:grid;grid-template-columns:1fr 280px;gap:14px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,#121a28,#0f1724);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:14px}
.grid{display:grid;gap:4px;background:#0a1220;padding:8px;border-radius:12px;border:1px solid #1e2e46}
.cell{aspect-ratio:1;background:#121a28;border:1px solid #1e2e46;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;cursor:pointer;user-select:none}
.cell.revealed{background:#0d1524;border-color:#233349;color:var(--text)}
.cell.mine{background:#3a1a1a;border-color:#f85149;color:#f85149}
.cell.flag{background:#1a2a1a;border-color:var(--green);color:var(--green)}
.stat{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:#0d1524;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.btn{appearance:none;border:1px solid var(--line);background:#0f1a2b;color:var(--text);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:12px;width:100%;margin-top:6px}
.btn.primary{background:linear-gradient(180deg,#1b2a44,#122038);border-color:#2a4a7a}
.select{width:100%;background:#0d1524;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:10px;font-family:inherit;font-size:12px}
.hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:8px}
</style>
</head>
<body>
<header>
<div class="brand">KUNAL / ARCADE — <span style="color:var(--red)">CODE MINES</span></div>
<a class="badge" href="./index.html">← All Games</a>
</header>
<div class="wrap">
<div class="card">
<div class="grid" id="grid"></div>
</div>
<div class="card">
<div class="stat"><span>⏱ Time</span><b id="time">00:00</b></div>
<div class="stat"><span>💣 Mines</span><b id="mines">10</b></div>
<div class="stat"><span>🚩 Flags</span><b id="flags">0</b></div>
<div class="stat"><span>Best</span><b id="best">—</b></div>
<select class="select" id="modeSel">
<option value="easy">Easy — 9×9, 10 mines</option>
<option value="normal" selected>Normal — 12×12, 24 mines</option>
<option value="hard">Hard — 16×16, 50 mines</option>
<option value="extreme">Extreme — 20×20, 80 mines</option>
</select>
<button class="btn primary" id="newBtn">↻ New Board</button>
<div class="hint">
<strong>How:</strong> Left click reveal, Right click flag. Numbers = adjacent bugs. Clear all non-mine cells.<br><br>
<strong>Modes:</strong> Easy to Extreme. Right click or long press to flag on mobile. Timer starts on first click.
</div>
</div>
</div>
<script>
const MODES={easy:{r:9,c:9,m:10},normal:{r:12,c:12,m:24},hard:{r:16,c:16,m:50},extreme:{r:20,c:20,m:80}};
let rows,cols,mines,board,revealed,flagged,gameOver,firstClick,timer,sec=0;
const gridEl=document.getElementById('grid'),timeEl=document.getElementById('time'),minesEl=document.getElementById('mines'),flagsEl=document.getElementById('flags'),bestEl=document.getElementById('best'),modeSel=document.getElementById('modeSel');

function init(){
 const cfg=MODES[modeSel.value];
 rows=cfg.r;cols=cfg.c;mines=cfg.m;
 board=Array(rows).fill(0).map(()=>Array(cols).fill(0));
 revealed=Array(rows).fill(0).map(()=>Array(cols).fill(false));
 flagged=Array(rows).fill(0).map(()=>Array(cols).fill(false));
 gameOver=false;firstClick=true;sec=0;clearInterval(timer);timeEl.textContent='00:00';
 minesEl.textContent=mines;flagsEl.textContent='0';
 gridEl.style.gridTemplateColumns=`repeat(${cols},1fr)`;
 render();
 const best=localStorage.getItem(`mines-best-${modeSel.value}`);bestEl.textContent=best?best+'s':'—';
}
function placeMines(safeR,safeC){
 let placed=0;
 while(placed<mines){
  let r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);
  if(board[r][c]===-1)continue;
  if(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1)continue;
  board[r][c]=-1;placed++;
 }
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(board[r][c]!==-1){
  let cnt=0;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===-1)cnt++;}
  board[r][c]=cnt;
 }
}
function render(){
 gridEl.innerHTML='';
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const d=document.createElement('div');d.className='cell';
  if(revealed[r][c]){
   d.classList.add('revealed');
   if(board[r][c]===-1){d.classList.add('mine');d.textContent='💣';}
   else if(board[r][c]>0){d.textContent=board[r][c];d.style.color=['','var(--blue)','var(--green)','var(--red)','var(--purple)','var(--gold)','var(--cyan)','var(--text)','var(--muted)'][board[r][c]]||'var(--text)';}
  }else if(flagged[r][c]){d.classList.add('flag');d.textContent='🚩';}
  d.addEventListener('click',()=>reveal(r,c));
  d.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
  d.addEventListener('touchstart',e=>{d._touchTimer=setTimeout(()=>toggleFlag(r,c),500);});
  d.addEventListener('touchend',()=>clearTimeout(d._touchTimer));
  gridEl.appendChild(d);
 }
 flagsEl.textContent=flagged.flat().filter(Boolean).length;
 if(checkWin()){gameOver=true;clearInterval(timer);let best=parseInt(localStorage.getItem(`mines-best-${modeSel.value}`)||'9999');if(sec<best){localStorage.setItem(`mines-best-${modeSel.value}`,sec);bestEl.textContent=sec+'s';}setTimeout(()=>alert(`Cleared! Time ${sec}s`),100);}
}
function reveal(r,c){
 if(gameOver||flagged[r][c])return;
 if(firstClick){placeMines(r,c);firstClick=false;timer=setInterval(()=>{sec++;timeEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;},1000);}
 if(revealed[r][c])return;
 revealed[r][c]=true;
 if(board[r][c]===-1){
  // reveal all mines
  for(let rr=0;rr<rows;rr++)for(let cc=0;cc<cols;cc++)if(board[rr][cc]===-1)revealed[rr][cc]=true;
  gameOver=true;clearInterval(timer);render();setTimeout(()=>alert('Boom! Hit a bug.'),100);return;
 }
 if(board[r][c]===0){
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&!revealed[nr][nc])reveal(nr,nc);}
 }
 render();
}
function toggleFlag(r,c){
 if(gameOver||revealed[r][c])return;
 flagged[r][c]=!flagged[r][c];
 render();
}
function checkWin(){
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)if(board[r][c]!==-1&&!revealed[r][c])return false;
 return true;
}
document.getElementById('newBtn').onclick=init;
modeSel.onchange=init;
init();
</script>
</body>
</html>
